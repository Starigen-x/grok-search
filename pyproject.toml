[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grok-search"
version = "2.0.0"
description = "个人自用的联网搜索 MCP 服务：web_search / get_sources / web_fetch 三工具，stdio 与 HTTP 双形态"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2,<4",
    "httpx>=0.28",
    "tenacity>=9.0",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
grok-search = "grok_search.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grok_search"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: 需要真实外网访问的测试，验收时用 pytest -m live 单独跑"]

[[tool.mypy.overrides]]
module = "trafilatura.*"
ignore_missing_imports = true
